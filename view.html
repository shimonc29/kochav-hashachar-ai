<!doctype html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d1e"><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet"><title>צופים בפרויקט | מעבר לדמיון</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Heebo,Arial,sans-serif;background:#090d1e;color:#f5f8ff}body{display:flex;flex-direction:column;min-height:100dvh}.top{display:flex;align-items:center;gap:15px;padding:12px 24px;min-height:76px;border-bottom:1px solid #25344d;background:#101a2d}.back,.external{display:inline-flex;gap:8px;align-items:center;border:1px solid #384961;border-radius:10px;padding:10px 14px;text-decoration:none;color:#fff;font-size:13px;font-weight:700;white-space:nowrap}.back:hover,.external:hover{border-color:#b9f4d6}.back{background:#b9f4d6;color:#0c1b20;border:0}.info{flex:1;min-width:0}.info b{font-size:18px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info span{font-size:12px;color:#9fadc6}.external{background:#1a2740}iframe{border:0;flex:1;width:100%;background:#fff;min-height:0}.error{margin:auto;text-align:center;line-height:2}.error a{color:#b9f4d6}.tip{font-size:12px;background:#17243b;color:#bdcce4;padding:6px 24px;text-align:center}@media(max-width:600px){.top{min-height:67px;padding:9px 11px;gap:8px}.back,.external{padding:9px;font-size:12px}.info b{font-size:14px}.info span{font-size:10px}.tip{font-size:10px;padding:6px}.hide-mobile{display:none}}</style></head><body><header class="top"><a href="./index.html#projects" class="back" aria-label="חזרה לכל הפרויקטים">→ <span class="hide-mobile">חזרה לתערוכה</span><span class="mobileOnly"></span></a><div class="info"><b id="title">טוען פרויקט...</b><span id="sub">תערוכת פרויקטי הסיום · כיתה ז׳</span></div><a id="external" class="external" target="_blank" rel="noopener noreferrer" hidden>↗ פתיחה בחלון חדש</a></header><div class="tip">טיפ: אם המשחק משתמש במקלדת, לחצו תחילה בתוך אזור המשחק. ניתן לפתוח אותו גם בחלון נפרד.</div><script src="projects.js"></script><script>(()=>{'use strict';const slug=new URLSearchParams(location.search).get('p'),p=PROJECTS.find(x=>x.slug===slug);if(!p){document.getElementById('title').textContent='הפרויקט לא נמצא';const msg=document.createElement('div');msg.className='error';msg.innerHTML='לא מצאנו את הפרויקט המבוקש.<br><a href="./index.html#projects">חזרה לכל הפרויקטים</a>';document.body.append(msg);return}document.title=p.title+' | מעבר לדמיון';document.getElementById('title').textContent=p.icon+' '+p.title;document.getElementById('sub').textContent=(p.student?'נוצר על ידי '+p.student+' · ':'')+p.desc;const path='p/'+encodeURIComponent(p.slug)+'.html';const link=document.getElementById('external');link.href=path;link.hidden=false;const frame=document.createElement('iframe');frame.src=path;frame.title=p.title;frame.allow='fullscreen; autoplay; clipboard-write';frame.allowFullscreen=true;document.body.append(frame)})();</script></body></html>
