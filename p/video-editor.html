<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עורך שורטס עם הוספת מכונית ואפקטים</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { display: flex; height: 100vh; background-color: #1e1e24; color: #fff; font-family: Arial, sans-serif; overflow: hidden; }
        .sidebar { width: 340px; background-color: #282830; padding: 20px; border-left: 1px solid #3d3d4d; display: flex; flex-direction: column; gap: 16px; z-index: 10; overflow-y: auto; }
        .sidebar h2 { font-size: 20px; color: #a78bfa; }
        .sidebar h3 { font-size: 15px; margin-bottom: 6px; color: #e5e7eb; }
        .control-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 13px; color: #9ca3af; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #4b5563; background: #111827; color: #fff; font-size: 14px; }
        input[type="file"] { padding: 8px; cursor: pointer; }
        button { background: #7c3aed; color: #fff; border: none; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #6d28d9; }
        .btn-row { display: flex; gap: 8px; }
        .quick-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .quick-btn { background: #374151; padding: 10px; font-size: 13px; }
        .quick-btn:hover { background: #4b5563; }
        .car-btn { background: #0284c7; }
        .car-btn:hover { background: #0369a1; }
        .export-section { background: #1f2937; padding: 14px; border-radius: 8px; border: 1px solid #4b5563; display: flex; flex-direction: column; gap: 10px; }
        .export-btn { background: #10b981; font-size: 15px; }
        .export-btn:hover { background: #059669; }
        .export-btn:disabled { background: #4b5563; cursor: not-allowed; }
        .status-msg { font-size: 13px; color: #34d399; text-align: center; min-height: 18px; }
        hr { border: none; border-top: 1px solid #3d3d4d; }
        .workspace { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; background: #0f0f13; }
        .phone-frame { width: 300px; height: 533px; position: relative; background: #000; border-radius: 16px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.6); border: 4px solid #374151; }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        .canvas-element { position: absolute; cursor: move; padding: 6px 12px; user-select: none; font-weight: bold; text-shadow: 2px 2px 6px rgba(0,0,0,0.9); border: 2px dashed transparent; transition: border-color 0.1s; white-space: nowrap; }
        .canvas-element.selected { border-color: #a78bfa; background: rgba(124, 58, 237, 0.2); border-radius: 4px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>🎨 עורך שורטס ופקד אפקטים</h2>
        
        <div class="control-group">
            <label>העלאת סרטון מהמחשב:</label>
            <input type="file" id="videoUpload" accept="video/*">
        </div>

        <hr>

        <div class="control-group">
            <h3>הוספת טקסט</h3>
            <div class="btn-row">
                <input type="text" id="textInput" placeholder="הקלד טקסט חדש...">
                <button id="addTextBtn">הוסף</button>
            </div>
        </div>

        <div class="control-group">
            <h3>אפקטים ומדבקות</h3>
            <div class="quick-buttons">
                <button class="quick-btn" onclick="addElement('⭐ כוכב זהב', 'text')">⭐ כוכב</button>
                <button class="quick-btn" onclick="addElement('🔥 טרנדי', 'text')">🔥 תגית</button>
                <button class="quick-btn" onclick="addElement('💡 טיפ חם', 'text')">💡 טיפ</button>
                <button class="quick-btn" onclick="addElement('🚀 צפייה נעימה', 'text')">🚀 טיל</button>
            </div>
            <button class="car-btn" style="margin-top: 8px;" onclick="addMovingCar()">🚗 הוסף מכונית נוסעת</button>
        </div>

        <hr>

        <div class="export-section">
            <h3>ייצוא ושמירה למחשב</h3>
            <button id="exportBtn" class="export-btn">🎬 הפק ושמור סרטון MP4</button>
            <div id="statusMsg" class="status-msg"></div>
        </div>

        <div style="margin-top: auto; font-size: 11px; color: #6b7280; text-align: center;">
            טיפ: תוכל לגרור את המכונית או הטקסט לכל מקום שתרצה על המסך!
        </div>
    </div>

    <div class="workspace">
        <div class="phone-frame" id="phoneFrame">
            <video id="bgVideo" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" crossorigin="anonymous" autoplay loop muted></video>
            <div id="elementsContainer" style="width: 100%; height: 100%; position: absolute; top: 0; left: 0; pointer-events: none;"></div>
        </div>
    </div>

    <script>
        // רשימת האלמנטים (טקסטים ואפקטים)
        let elements = [
            { id: 1, type: 'text', content: 'הכותרת שלך כאן ✨', x: 40, y: 70, fontSize: 20, color: '#ffffff' }
        ];

        let selectedId = null;

        const elementsContainer = document.getElementById('elementsContainer');
        const textInput = document.getElementById('textInput');
        const videoUpload = document.getElementById('videoUpload');
        const bgVideo = document.getElementById('bgVideo');
        const exportBtn = document.getElementById('exportBtn');
        const statusMsg = document.getElementById('statusMsg');

        // טעינת סרטון מהמחשב
        videoUpload.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                bgVideo.src = fileURL;
                bgVideo.load();
                bgVideo.play().catch(e => console.log("Auto-play error:", e));
                statusMsg.innerText = "הסרטון הועלה בהצלחה!";
                setTimeout(() => statusMsg.innerText = "", 3000);
            }
        });

        document.getElementById('addTextBtn').addEventListener('click', () => {
            const text = textInput.value.trim();
            if (!text) return;
            addElement(text, 'text');
            textInput.value = '';
        });

        // הוספת אלמנט כללי (כמו טקסטים ואייקונים)
        function addElement(content, type) {
            const newEl = {
                id: Date.now(),
                type: type,
                content: content,
                x: 50 + Math.random() * 30,
                y: 150 + Math.random() * 100,
                fontSize: 24,
                color: '#ffffff'
            };
            elements.push(newEl);
            renderElements();
        }

        // הוספת אפקט מכונית שנוסעת על המסך
        function addMovingCar() {
            const newEl = {
                id: Date.now(),
                type: 'car',
                content: '🏎️',
                x: -30,  // מתחיל מחוץ למסך משמאל
                y: 350 + Math.random() * 100,
                fontSize: 35,
                speed: 2 // מהירות תנועה
            };
            elements.push(newEl);
            renderElements();
        }

        // ציור מחדש של המסך
        function renderElements() {
            elementsContainer.innerHTML = '';
            elements.forEach(el => {
                const div = document.createElement('div');
                div.className = `canvas-element ${selectedId === el.id ? 'selected' : ''}`;
                div.style.left = `${el.x}px`;
                div.style.top = `${el.y}px`;
                div.style.fontSize = `${el.fontSize}px`;
                div.style.pointerEvents = 'auto';
                div.innerText = el.content;

                // מאפשר גרירה ידנית של כל אלמנט (כולל המכונית)
                div.addEventListener('mousedown', (e) => {
                    selectedId = el.id;
                    renderElements();
                    
                    const frameRect = document.getElementById('phoneFrame').getBoundingClientRect();
                    
                    function onMouseMove(moveEvent) {
                        let newX = moveEvent.clientX - frameRect.left - 20;
                        let newY = moveEvent.clientY - frameRect.top - 20;
                        
                        if (newX < -50) newX = -50;
                        if (newY < 0) newY = 0;

                        el.x = newX;
                        el.y = newY;
                        div.style.left = `${newX}px`;
                        div.style.top = `${newY}px`;
                    }

                    function onMouseUp() {
                        window.removeEventListener('mousemove', onMouseMove);
                        window.removeEventListener('mouseup', onMouseUp);
                    }

                    window.addEventListener('mousemove', onMouseMove);
                    window.addEventListener('mouseup', onMouseUp);
                });

                elementsContainer.appendChild(div);
            });
        }

        renderElements();

        // ייצוא ושמירת סרטון כולל האפקטים והתנועה
        exportBtn.addEventListener('click', async () => {
            if (!window.MediaRecorder) {
                alert("הדפדפן שלך אינו תומך בהקלטת וידאו מובנית.");
                return;
            }

            exportBtn.disabled = true;
            statusMsg.innerText = "מכין ומקליט את הסרטון עם האפקטים...";

            try {
                bgVideo.currentTime = 0;
                await bgVideo.play();

                const canvas = document.createElement('canvas');
                canvas.width = 360;   
                canvas.height = 640;  
                const ctx = canvas.getContext('2d');

                const stream = canvas.captureStream(30); 
                let recordedChunks = [];
                
                const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus') 
                    ? 'video/webm;codecs=vp9,opus' 
                    : (MediaRecorder.isTypeSupported('video/webm') ? 'video/webm' : 'video/mp4');

                const mediaRecorder = new MediaRecorder(stream, { mimeType });

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: mimeType });
                    const url = URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = 'car-effect-short.webm';
                    document.body.appendChild(a);
                    a.click();
                    
                    setTimeout(() => {
                        document.body.removeChild(a);
                        window.URL.revokeObjectURL(url);
                    }, 100);

                    exportBtn.disabled = false;
                    statusMsg.innerText = "הסרטון עם המכונית יוצר בהצלחה!";
                    setTimeout(() => statusMsg.innerText = "", 4000);
                };

                mediaRecorder.start();

                const frameWidth = 300;
                const frameHeight = 533;

                const drawInterval = setInterval(() => {
                    if (bgVideo.paused || bgVideo.ended) {
                        return;
                    }

                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(bgVideo, 0, 0, canvas.width, canvas.height);

                    const scaleX = canvas.width / frameWidth;
                    const scaleY = canvas.height / frameHeight;

                    // עדכון וציור כל האפקטים (כולל הזזת המכונית אוטומטית בזמן ההקלטה אם זוזה)
                    elements.forEach(el => {
                        ctx.save();
                        ctx.font = `bold ${el.fontSize * scaleY}px Arial`;
                        ctx.fillStyle = el.color || '#ffffff';
                        ctx.shadowColor = 'rgba(0,0,0,0.9)';
                        ctx.shadowBlur = 6;
                        
                        // אם זו מכונית, אפשר להזיזה אוטומטית קצת ימינה בכל פريم בזמן הייצוא
                        if (el.type === 'car') {
                            el.x += 1.5; // מהירות נסיעה בייצוא
                            if (el.x > frameWidth) el.x = -40; // חוזר להתחלה אם יצא מהמסך
                        }

                        ctx.fillText(el.content, el.x * scaleX, (el.y + el.fontSize) * scaleY);
                        ctx.restore();
                    });

                    // עדכון ויזואלי גם במסך התצוגה תוך כדי הקלטה
                    renderElements();

                }, 1000 / 30);

                // עצירת ההקלטה לאחר 6 שניות
                setTimeout(() => {
                    clearInterval(drawInterval);
                    if (mediaRecorder.state === 'recording') {
                        mediaRecorder.stop();
                    }
                    bgVideo.pause();
                }, 6000);

            } catch (err) {
                console.error(err);
                exportBtn.disabled = false;
                statusMsg.innerText = "שגיאה בייצוא הסרטון.";
            }
        });
    </script>
</body>
</html>
